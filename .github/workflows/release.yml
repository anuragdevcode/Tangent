name: Build and Release DMG

on:
  push:
    tags:
      - 'v*'          # runs when you push a tag like v0.5.0
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to publish a Release

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1) runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mpv (build-time dependency)
        run: brew install mpv

      - name: Build app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Read version from Info.plist
        id: ver
        run: |
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Tangent.app/Contents/Info.plist)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match app version $VERSION" >&2
            exit 1
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { printing = 1; next }
            printing && index($0, "## [") == 1 { exit }
            printing { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "error: no CHANGELOG section for $VERSION" >&2
            exit 1
          fi

      - name: Create DMG
        run: |
          mkdir dmg_staging
          ditto build/Tangent.app dmg_staging/Tangent.app
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Tangent" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "Tangent-${{ steps.ver.outputs.version }}-arm64.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tangent-dmg
          path: "*.dmg"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "V${{ steps.ver.outputs.version }}"
          body_path: release-notes.md
          files: "*.dmg"
          fail_on_unmatched_files: true
          draft: false
          prerelease: false